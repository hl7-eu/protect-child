<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" font-family="Helvetica,Arial,sans-serif" role="img" aria-label="PROTECT-CHILD patient timeline: pre-transplant baseline, transplant at day 0, follow-up visits at 1, 3, 6, 12 and 24 months, plus clinical-event and termination visits, with the data collected at each stage.">
  <rect x="0" y="0" width="980" height="600" fill="#ffffff"/>
  <text x="30" y="40" font-size="24" font-weight="700" fill="#12395b">PROTECT-CHILD patient timeline</text>
  <text x="30" y="64" font-size="14" fill="#5b6b7a">Paediatric liver / kidney transplant — scheduled visits across 24 months of follow-up (DM v1.2)</text>

  <!-- Clinical-event banner -->
  <rect x="30" y="86" width="920" height="34" rx="6" fill="#fdf0e3" stroke="#e0913a" stroke-dasharray="5 4"/>
  <text x="46" y="108" font-size="12.5" fill="#9a5a12"><tspan font-weight="700">Clinical-event visit</tspan> — an unscheduled visit recorded whenever a clinical event occurs (rejection, infection, graft failure), at any time.</text>

  <!-- Timeline axis -->
  <line x1="70" y1="210" x2="905" y2="210" stroke="#12395b" stroke-width="3"/>

  <!-- Transplant marker -->
  <line x1="215" y1="150" x2="215" y2="270" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="131" y="126" width="168" height="26" rx="13" fill="#c0392b"/>
  <text x="215" y="144" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">TRANSPLANT (day 0)</text>

  <!-- Nodes: cx, label, sublabel -->
  <!-- Pre-transplant -->
  <g>
    <circle cx="110" cy="210" r="11" fill="#12395b"/>
    <text x="110" y="192" font-size="13" font-weight="700" fill="#12395b" text-anchor="middle">Pre-transplant</text>
    <text x="110" y="234" font-size="11.5" fill="#5b6b7a" text-anchor="middle">baseline</text>
  </g>
  <!-- month nodes -->
  <g fill="#2e7d5b">
    <circle cx="330" cy="210" r="10"/><circle cx="450" cy="210" r="10"/><circle cx="570" cy="210" r="10"/><circle cx="700" cy="210" r="10"/><circle cx="835" cy="210" r="10"/>
  </g>
  <g font-size="13" font-weight="700" fill="#1f5a41" text-anchor="middle">
    <text x="330" y="192">1 month</text><text x="450" y="192">3 months</text><text x="570" y="192">6 months</text><text x="700" y="192">12 months</text><text x="835" y="192">24 months</text>
  </g>

  <!-- Termination -->
  <circle cx="905" cy="210" r="8" fill="#6a4c93"/>
  <text x="905" y="240" font-size="11.5" font-weight="700" fill="#6a4c93" text-anchor="middle">Termination</text>

  <!-- Baseline callout -->
  <rect x="40" y="300" width="330" height="120" rx="8" fill="#eef3f8" stroke="#12395b"/>
  <text x="56" y="322" font-size="14" font-weight="700" fill="#12395b">At pre-transplant (baseline)</text>
  <text x="56" y="344" font-size="12" fill="#25405a">Recipient demographics · gender · age</text>
  <text x="56" y="362" font-size="12" fill="#25405a">Primary disease diagnosis · date of diagnosis</text>
  <text x="56" y="380" font-size="12" fill="#25405a">PRA (max / last) · HLA typing · ABO / Rh</text>
  <text x="56" y="398" font-size="12" fill="#25405a">Pre-medication (antihypertensive, rituximab,</text>
  <text x="56" y="414" font-size="12" fill="#25405a">antiviral prophylaxis, desensitisation)</text>

  <!-- Transplant callout -->
  <rect x="390" y="300" width="250" height="120" rx="8" fill="#fbecea" stroke="#c0392b"/>
  <text x="406" y="322" font-size="14" font-weight="700" fill="#c0392b">At transplant (day 0)</text>
  <text x="406" y="344" font-size="12" fill="#6d241c">Donor (type, age, graft, HLA/ABO/Rh)</text>
  <text x="406" y="362" font-size="12" fill="#6d241c">Transplant procedure · type</text>
  <text x="406" y="380" font-size="12" fill="#6d241c">Intraoperative details (ischaemia times,</text>
  <text x="406" y="396" font-size="12" fill="#6d241c">anastomoses, complications)</text>
  <text x="406" y="414" font-size="12" fill="#6d241c">Induction immunosuppression</text>

  <!-- Follow-up callout -->
  <rect x="660" y="300" width="290" height="120" rx="8" fill="#eaf5ef" stroke="#2e7d5b"/>
  <text x="676" y="322" font-size="14" font-weight="700" fill="#1f5a41">At each follow-up visit (1–24 m)</text>
  <text x="676" y="344" font-size="12" fill="#1f4433">Vital signs (incl. 24-h ABPM) · clinical variables</text>
  <text x="676" y="362" font-size="12" fill="#1f4433">Laboratory results · immunological data</text>
  <text x="676" y="380" font-size="12" fill="#1f4433">Microbiology · instrumental investigations</text>
  <text x="676" y="398" font-size="12" fill="#1f4433">Maintenance immunosuppression + PK levels</text>
  <text x="676" y="414" font-size="12" fill="#1f4433">Concomitant medications · biosamples</text>

  <!-- Data domains legend -->
  <text x="30" y="470" font-size="14" font-weight="700" fill="#12395b">Data domains captured across the timeline</text>
  <g font-size="12" fill="#25405a">
    <rect x="30" y="482" width="150" height="26" rx="13" fill="#eef3f8" stroke="#b8c6d6"/><text x="105" y="499" text-anchor="middle">Vital signs / ABPM</text>
    <rect x="190" y="482" width="150" height="26" rx="13" fill="#eef3f8" stroke="#b8c6d6"/><text x="265" y="499" text-anchor="middle">Laboratory</text>
    <rect x="350" y="482" width="170" height="26" rx="13" fill="#eef3f8" stroke="#b8c6d6"/><text x="435" y="499" text-anchor="middle">Immunological data</text>
    <rect x="530" y="482" width="140" height="26" rx="13" fill="#eef3f8" stroke="#b8c6d6"/><text x="600" y="499" text-anchor="middle">Microbiology</text>
    <rect x="680" y="482" width="180" height="26" rx="13" fill="#eef3f8" stroke="#b8c6d6"/><text x="770" y="499" text-anchor="middle">Immunosuppression + PK</text>
    <rect x="30" y="516" width="150" height="26" rx="13" fill="#eef3f8" stroke="#b8c6d6"/><text x="105" y="533" text-anchor="middle">Instrumental inv.</text>
    <rect x="190" y="516" width="180" height="26" rx="13" fill="#eef3f8" stroke="#b8c6d6"/><text x="280" y="533" text-anchor="middle">Concomitant medication</text>
    <rect x="380" y="516" width="170" height="26" rx="13" fill="#eef3f8" stroke="#b8c6d6"/><text x="465" y="533" text-anchor="middle">Clinical events</text>
    <rect x="560" y="516" width="200" height="26" rx="13" fill="#eef3f8" stroke="#b8c6d6"/><text x="660" y="533" text-anchor="middle">Biosamples → genomic / omics</text>
  </g>

  <text x="30" y="575" font-size="11" fill="#8592a0">Every follow-up record links to its Visit; a Visit links to the Patient. See the Data Dictionary and Mapping pages for field-level detail.</text>
</svg>
