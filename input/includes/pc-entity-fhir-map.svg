<svg viewBox="0 0 960 720" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, sans-serif" font-size="12">
  <title>PROTECT-CHILD Data Model to FHIR Resource Map</title>
  <desc>Diagram showing how PROTECT-CHILD logical model entities relate to each other and map to FHIR R4 resources. Click any box to navigate to its detail page.</desc>

  <style>
    a:hover rect { opacity: 0.82; }
    a rect, a text { cursor: pointer; }
  </style>

  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4a90d9"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e67e22"/>
    </marker>
  </defs>

  <!-- Legend -->
  <rect x="20" y="14" width="920" height="32" rx="4" fill="#f8f8f8" stroke="#ddd"/>
  <rect x="32" y="22" width="12" height="12" rx="2" fill="#4a90d9"/>
  <text x="50" y="33" fill="#333">Participant</text>
  <rect x="130" y="22" width="12" height="12" rx="2" fill="#e67e22"/>
  <text x="148" y="33" fill="#333">Event</text>
  <rect x="208" y="22" width="12" height="12" rx="2" fill="#27ae60"/>
  <text x="226" y="33" fill="#333">Clinical</text>
  <rect x="298" y="22" width="12" height="12" rx="2" fill="#8e44ad"/>
  <text x="316" y="33" fill="#333">Lab</text>
  <rect x="358" y="22" width="12" height="12" rx="2" fill="#c0392b"/>
  <text x="376" y="33" fill="#333">Medication</text>
  <rect x="460" y="22" width="12" height="12" rx="2" fill="#16a085"/>
  <text x="478" y="33" fill="#333">Specimen</text>
  <rect x="556" y="22" width="12" height="12" rx="2" fill="#7f8c8d"/>
  <text x="574" y="33" fill="#333">Outcome</text>
  <rect x="660" y="22" width="12" height="12" rx="2" fill="#f0f0f0" stroke="#aaa"/>
  <text x="678" y="33" fill="#333">FHIR resource (right panel)</text>

  <!-- Section labels -->
  <text x="270" y="68" fill="#666" font-size="11" font-weight="600" text-anchor="middle">DATA MODEL ENTITIES</text>
  <text x="730" y="68" fill="#666" font-size="11" font-weight="600" text-anchor="middle">FHIR R4 RESOURCES</text>
  <line x1="540" y1="55" x2="540" y2="710" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4 3"/>

