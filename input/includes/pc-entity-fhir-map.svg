  <!-- Arrow legend -->
  <text x="30" y="560" fill="#555" font-size="10" font-style="italic">A → B: each B record holds a FHIR Reference back to A (e.g. Observation.encounter → Encounter)</text>

  <!-- ── RELATIONSHIP ARROWS ── -->

  <!-- Patient → Visit -->
  <line x1="270" y1="124" x2="270" y2="185" stroke="#4a90d9" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Donor → Transplant -->
  <line x1="436" y1="124" x2="436" y2="185" stroke="#4a90d9" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Visit → Transplant -->
  <line x1="345" y1="207" x2="361" y2="207" stroke="#e67e22" stroke-width="1.5" marker-end="url(#arr-orange)"/>

  <!-- LEFT COLUMN SPINE  x=14 (left of all left-column boxes which start at x=30)
       Trunk: Visit bottom-left → horizontal to spine → vertical down.
       Branches: short horizontal arrows into each box's left edge. -->
  <polyline points="195,229 14,229 14,514" stroke="#e67e22" stroke-width="1.2" fill="none"/>
  <line x1="14" y1="314" x2="30" y2="314" stroke="#e67e22" stroke-width="1.2" marker-end="url(#arr-orange)"/>
  <line x1="14" y1="364" x2="30" y2="364" stroke="#e67e22" stroke-width="1.2" marker-end="url(#arr-orange)"/>
  <line x1="14" y1="414" x2="30" y2="414" stroke="#e67e22" stroke-width="1.2" marker-end="url(#arr-orange)"/>
  <line x1="14" y1="464" x2="30" y2="464" stroke="#e67e22" stroke-width="1.2" marker-end="url(#arr-orange)"/>
  <line x1="14" y1="514" x2="30" y2="514" stroke="#e67e22" stroke-width="1.2" marker-end="url(#arr-orange)"/>

  <!-- MIDDLE-LEFT SPINE  x=187 (gap between left col x≤178 and middle col x≥196)
       Visit centre-bottom (270,229) drops straight down to Lab Test (same x=270).
       Trunk for remaining middle-col boxes runs left from Visit bottom to spine at x=187. -->
  <line x1="270" y1="229" x2="270" y2="295" stroke="#e67e22" stroke-width="1.2" marker-end="url(#arr-orange)"/>
  <polyline points="270,229 187,229 187,514" stroke="#e67e22" stroke-width="1.2" fill="none"/>
  <line x1="187" y1="364" x2="196" y2="364" stroke="#e67e22" stroke-width="1.2" marker-end="url(#arr-orange)"/>
  <line x1="187" y1="412" x2="196" y2="412" stroke="#e67e22" stroke-width="1.2" marker-end="url(#arr-orange)"/>
  <line x1="187" y1="462" x2="196" y2="462" stroke="#e67e22" stroke-width="1.2" marker-end="url(#arr-orange)"/>
  <line x1="187" y1="514" x2="196" y2="514" stroke="#e67e22" stroke-width="1.2" marker-end="url(#arr-orange)"/>

  <!-- RIGHT SPINE  x=352 (just left of Transplant's left edge at x=361)
       Trunk: Visit centre-bottom → right to x=352 → vertical down.
       Branches: short horizontal arrows into each right-col box's left edge (x=362). -->
  <polyline points="270,229 352,229 352,414" stroke="#e67e22" stroke-width="1.2" fill="none"/>
  <line x1="352" y1="314" x2="362" y2="314" stroke="#e67e22" stroke-width="1.2" marker-end="url(#arr-orange)"/>
  <line x1="352" y1="364" x2="362" y2="364" stroke="#e67e22" stroke-width="1.2" marker-end="url(#arr-orange)"/>
  <line x1="352" y1="414" x2="362" y2="414" stroke="#e67e22" stroke-width="1.2" marker-end="url(#arr-orange)"/>

  <!-- Immunosuppressant → Drug Catalogue (straight vertical within right column) -->
  <line x1="436" y1="433" x2="436" y2="445" stroke="#c0392b" stroke-width="1.2" marker-end="url(#arr-orange)"/>

