<svg viewBox="0 0 1060 480" xmlns="http://www.w3.org/2000/svg" role="img"
     font-family="system-ui, sans-serif" font-size="11">
  <title>PROTECT-CHILD FHIR Profile Reference Map</title>
  <desc>All FHIR profiles defined in the IG and the references between them.</desc>

  <defs>
    <marker id="a-blu" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0,7 2.5,0 5" fill="#4a90d9"/>
    </marker>
    <marker id="a-ora" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0,7 2.5,0 5" fill="#e67e22"/>
    </marker>
    <marker id="a-tea" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0,7 2.5,0 5" fill="#16a085"/>
    </marker>
    <marker id="a-red" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0,7 2.5,0 5" fill="#c0392b"/>
    </marker>
    <marker id="a-pur" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0,7 2.5,0 5" fill="#8e44ad"/>
    </marker>
    <marker id="a-drk" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0,7 2.5,0 5" fill="#555"/>
    </marker>
    <marker id="a-db"  markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0,7 2.5,0 5" fill="#2980b9"/>
    </marker>
  </defs>

  <!-- ═══ LEGEND ═══ -->
  <rect x="10" y="6" width="1040" height="26" rx="3" fill="#f5f5f5" stroke="#ddd"/>
  <line x1="18"  y1="19" x2="34"  y2="19" stroke="#4a90d9" stroke-width="2"   marker-end="url(#a-blu)"/>
  <text x="38"  y="23" fill="#333" font-size="10">.subject</text>
  <line x1="102" y1="19" x2="118" y2="19" stroke="#e67e22" stroke-width="2"   marker-end="url(#a-ora)"/>
  <text x="122" y="23" fill="#333" font-size="10">.encounter / .context</text>
  <line x1="252" y1="19" x2="268" y2="19" stroke="#555" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#a-drk)"/>
  <text x="272" y="23" fill="#333" font-size="10">.focus / .reasonRef / donor_id ext</text>
  <line x1="452" y1="19" x2="468" y2="19" stroke="#555" stroke-width="1.5" stroke-dasharray="2 2" marker-end="url(#a-drk)"/>
  <text x="472" y="23" fill="#333" font-size="10">.partOf</text>
  <line x1="520" y1="19" x2="536" y2="19" stroke="#16a085" stroke-width="1.5" marker-end="url(#a-tea)"/>
  <text x="540" y="23" fill="#333" font-size="10">.specimen</text>
  <line x1="608" y1="19" x2="624" y2="19" stroke="#c0392b" stroke-width="1.5" marker-end="url(#a-red)"/>
  <text x="628" y="23" fill="#333" font-size="10">.medication</text>
  <line x1="700" y1="19" x2="716" y2="19" stroke="#8e44ad" stroke-width="1.5" marker-end="url(#a-pur)"/>
  <text x="720" y="23" fill="#333" font-size="10">.result</text>
  <line x1="762" y1="19" x2="778" y2="19" stroke="#2980b9" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#a-db)"/>
  <text x="782" y="23" fill="#333" font-size="10">.managingOrg</text>

  <!-- ═══════════════════════════════════════════════
       TIER 1 — ANCHOR PROFILES  (y = 42)
       ═══════════════════════════════════════════════ -->

  <!-- StudyCentre -->
  <rect x="10"  y="42" width="128" height="38" rx="5" fill="#2980b9"/>
  <text x="74"  y="59" fill="white" font-weight="600" text-anchor="middle">StudyCentre</text>
  <text x="74"  y="73" fill="#cce5ff" font-size="9"   text-anchor="middle">Organization</text>

  <!-- PatientTransplant -->
  <rect x="398" y="42" width="168" height="38" rx="5" fill="#4a90d9"/>
  <text x="482" y="59" fill="white" font-weight="700" text-anchor="middle" font-size="12">PatientTransplant</text>
  <text x="482" y="73" fill="#d4e8ff" font-size="9"   text-anchor="middle">Patient</text>

  <!-- Donor -->
  <rect x="870" y="42" width="118" height="38" rx="5" fill="#4a90d9"/>
  <text x="929" y="59" fill="white" font-weight="700" text-anchor="middle" font-size="12">Donor</text>
  <text x="929" y="73" fill="#d4e8ff" font-size="9"   text-anchor="middle">Patient</text>

  <!-- .managingOrg: PatientTransplant → StudyCentre (dashed, runs in gap above Tier 2) -->
  <line x1="398" y1="61" x2="138" y2="61" stroke="#2980b9" stroke-width="1.4" stroke-dasharray="4 2" marker-end="url(#a-db)"/>
  <text x="268" y="57" fill="#2980b9" font-size="8.5" text-anchor="middle">.managingOrg</text>

  <!-- ═══════════════════════════════════════════════
       TIER 2 — ENCOUNTER + TRANSPLANT  (y = 142)
       ═══════════════════════════════════════════════ -->

  <!-- Visit -->
  <rect x="258" y="142" width="122" height="38" rx="5" fill="#e67e22"/>
  <text x="319" y="159" fill="white" font-weight="600" text-anchor="middle">Visit</text>
  <text x="319" y="173" fill="#fde8c8" font-size="9"   text-anchor="middle">Encounter</text>

  <!-- Transplant -->
  <rect x="584" y="142" width="128" height="38" rx="5" fill="#d35400"/>
  <text x="648" y="159" fill="white" font-weight="600" text-anchor="middle">Transplant</text>
  <text x="648" y="173" fill="#fde8c8" font-size="9"   text-anchor="middle">Procedure</text>

  <!-- TransplantDetails -->
  <rect x="732" y="142" width="148" height="38" rx="5" fill="#27ae60"/>
  <text x="806" y="158" fill="white" font-weight="600" text-anchor="middle">TransplantDetails</text>
  <text x="806" y="172" fill="#c8f0d8" font-size="9"   text-anchor="middle">Observation</text>

  <!-- Visit.subject → PatientTransplant -->
  <line x1="482" y1="80" x2="358" y2="142" stroke="#4a90d9" stroke-width="1.5" marker-end="url(#a-blu)"/>

  <!-- Transplant.subject → PatientTransplant (diagonal, clear of all boxes) -->
  <line x1="648" y1="142" x2="566" y2="80" stroke="#4a90d9" stroke-width="1.5" marker-end="url(#a-blu)"/>

  <!-- Transplant.encounter → Visit (horizontal in Tier-2 row gap) -->
  <line x1="584" y1="161" x2="380" y2="161" stroke="#e67e22" stroke-width="1.5" marker-end="url(#a-ora)"/>

  <!-- Transplant.extension[donor_id] → Donor
       Route: right edge of Transplant → up through gap between Transplant and TransplantDetails → above Tier 2 → into Donor -->
  <polyline points="712,142 720,142 720,110 929,110 929,80"
            stroke="#555" stroke-width="1.3" stroke-dasharray="4 2" fill="none" marker-end="url(#a-drk)"/>
  <text x="820" y="107" fill="#555" font-size="8.5">donor_id ext</text>

  <!-- TransplantDetails.partOf → Transplant (short horizontal in Tier-2 gap) -->
  <line x1="732" y1="158" x2="712" y2="158" stroke="#555" stroke-width="1.3" stroke-dasharray="2 2" marker-end="url(#a-drk)"/>

  <!-- TransplantDetails.subject → PatientTransplant
       Route: up from top of TransplantDetails, diagonal to PatientTransplant right-bottom corner (all above Tier 2) -->
  <polyline points="806,142 806,110 566,80"
            stroke="#4a90d9" stroke-width="1.1" fill="none" marker-end="url(#a-blu)"/>

  <!-- ═══════════════════════════════════════════════
       BANNERS  (y = 192)
       ═══════════════════════════════════════════════ -->
  <rect x="10" y="192" width="1040" height="16" rx="3" fill="#eef5fb"/>
  <text x="530" y="204" fill="#2c6fad" font-size="9" font-weight="600" text-anchor="middle">
    All profiles below carry  .subject → PatientTransplant
  </text>
  <rect x="10" y="210" width="1040" height="16" rx="3" fill="#fef4ec"/>
  <text x="530" y="222" fill="#c0622c" font-size="9" font-weight="600" text-anchor="middle">
    Most also carry  .encounter / .context → Visit  (exceptions: PatientObservations, Immunosuppressant)
  </text>

  <!-- ═══════════════════════════════════════════════
       TIER 3 — CLINICAL OBSERVATIONS  (y = 236, green)
       ═══════════════════════════════════════════════ -->

  <!-- VitalSign -->
  <rect x="10"  y="236" width="122" height="38" rx="5" fill="#27ae60"/>
  <text x="71"  y="252" fill="white" font-weight="600" text-anchor="middle">VitalSign</text>
  <text x="71"  y="266" fill="#c8f0d8" font-size="9"   text-anchor="middle">Observation (panel)</text>

  <!-- ClinicalVariable -->
  <rect x="146" y="236" width="128" height="38" rx="5" fill="#27ae60"/>
  <text x="210" y="252" fill="white" font-weight="600" text-anchor="middle">ClinicalVariable</text>
  <text x="210" y="266" fill="#c8f0d8" font-size="9"   text-anchor="middle">Observation</text>

  <!-- ImmunologicalData -->
  <rect x="288" y="236" width="148" height="38" rx="5" fill="#27ae60"/>
  <text x="362" y="252" fill="white" font-weight="600" text-anchor="middle">ImmunologicalData</text>
  <text x="362" y="266" fill="#c8f0d8" font-size="9"   text-anchor="middle">Observation (panel)</text>

  <!-- Microbiology -->
  <rect x="450" y="236" width="118" height="38" rx="5" fill="#27ae60"/>
  <text x="509" y="252" fill="white" font-weight="600" text-anchor="middle">Microbiology</text>
  <text x="509" y="266" fill="#c8f0d8" font-size="9"   text-anchor="middle">Observation (panel)</text>

  <!-- InstrInvestigation -->
  <rect x="582" y="236" width="140" height="38" rx="5" fill="#27ae60"/>
  <text x="652" y="252" fill="white" font-weight="600" text-anchor="middle">InstrInvestigation</text>
  <text x="652" y="266" fill="#c8f0d8" font-size="9"   text-anchor="middle">Observation</text>

  <!-- PatientObservations -->
  <rect x="736" y="236" width="150" height="38" rx="5" fill="#27ae60"/>
  <text x="811" y="250" fill="white" font-weight="600" text-anchor="middle">PatientObservations</text>
  <text x="811" y="264" fill="#c8f0d8" font-size="9"   text-anchor="middle">Obs (demog/immun/disease)</text>

  <!-- ImmPatPKObservation -->
  <rect x="900" y="236" width="150" height="38" rx="5" fill="#27ae60"/>
  <text x="975" y="252" fill="white" font-weight="600" text-anchor="middle">ImmPatPKObs</text>
  <text x="975" y="266" fill="#c8f0d8" font-size="9"   text-anchor="middle">Observation</text>

  <!-- ImmunologicalData.focus → Donor
       Route: right edge of ImmData (x=436) → up to y=228 (above Tier 3, below banners) → right to Donor center → up into Donor -->
  <polyline points="436,249 436,228 929,228 929,80"
            stroke="#555" stroke-width="1.2" stroke-dasharray="4 2" fill="none" marker-end="url(#a-drk)"/>
  <text x="680" y="225" fill="#555" font-size="8.5">.focus</text>

  <!-- Microbiology.focus → Donor (optional, dashed)
       Route: right edge of Microbiology (x=568) → up to y=232 (in gap, offset from ImmData line) → right to Donor → up -->
  <polyline points="568,251 575,251 575,232 950,232 950,80"
            stroke="#888" stroke-width="1" stroke-dasharray="3 3" fill="none" marker-end="url(#a-drk)"/>
  <text x="770" y="242" fill="#888" font-size="8" font-style="italic">.focus (opt)</text>

  <!-- ═══════════════════════════════════════════════
       TIER 4 — LAB · SPECIMEN · CONDITIONS  (y = 296)
       ═══════════════════════════════════════════════ -->

  <!-- LabResultObservation -->
  <rect x="10"  y="296" width="128" height="38" rx="5" fill="#8e44ad"/>
  <text x="74"  y="312" fill="white" font-weight="600" text-anchor="middle">LabResultObs</text>
  <text x="74"  y="326" fill="#e8d0f8" font-size="9"   text-anchor="middle">Observation</text>

  <!-- LabReport -->
  <rect x="152" y="296" width="118" height="38" rx="5" fill="#8e44ad"/>
  <text x="211" y="312" fill="white" font-weight="600" text-anchor="middle">LabReport</text>
  <text x="211" y="326" fill="#e8d0f8" font-size="9"   text-anchor="middle">DiagnosticReport</text>

  <!-- BioSample -->
  <rect x="284" y="296" width="112" height="38" rx="5" fill="#16a085"/>
  <text x="340" y="312" fill="white" font-weight="600" text-anchor="middle">BioSample</text>
  <text x="340" y="326" fill="#c0f0e8" font-size="9"   text-anchor="middle">Specimen</text>

  <!-- BioSampleAnalysisRequest -->
  <rect x="410" y="296" width="158" height="38" rx="5" fill="#16a085"/>
  <text x="489" y="311" fill="white" font-weight="600" text-anchor="middle">BioSampleAnalysis</text>
  <text x="489" y="323" fill="#c0f0e8" font-size="9"   text-anchor="middle">Req (ServiceRequest)</text>

  <!-- ClinicalEvent -->
  <rect x="584" y="296" width="118" height="38" rx="5" fill="#7f8c8d"/>
  <text x="643" y="312" fill="white" font-weight="600" text-anchor="middle">ClinicalEvent</text>
  <text x="643" y="326" fill="#e0e8e8" font-size="9"   text-anchor="middle">Condition</text>

  <!-- ClinicalEventFlagObs -->
  <rect x="716" y="296" width="140" height="38" rx="5" fill="#7f8c8d"/>
  <text x="786" y="311" fill="white" font-weight="600" text-anchor="middle">ClinicalEventFlag</text>
  <text x="786" y="325" fill="#e0e8e8" font-size="9"   text-anchor="middle">Obs (Observation)</text>

  <!-- ClinicalEventProcedure -->
  <rect x="870" y="296" width="148" height="38" rx="5" fill="#7f8c8d"/>
  <text x="944" y="311" fill="white" font-weight="600" text-anchor="middle">ClinicalEventProc</text>
  <text x="944" y="325" fill="#e0e8e8" font-size="9"   text-anchor="middle">(Procedure)</text>

  <!-- LabReport.result → LabResultObs (purple, left-to-left in same row) -->
  <line x1="152" y1="312" x2="138" y2="312" stroke="#8e44ad" stroke-width="1.3" marker-end="url(#a-pur)"/>

  <!-- LabReport.specimen → BioSample (horizontal in row gap between LabReport right and BioSample left) -->
  <line x1="270" y1="321" x2="284" y2="321" stroke="#16a085" stroke-width="1.3" marker-end="url(#a-tea)"/>

  <!-- LabResultObs.specimen → BioSample
       Route BELOW Tier 4 to avoid passing through LabReport box -->
  <polyline points="74,334 74,348 340,348 340,334"
            stroke="#16a085" stroke-width="1.3" fill="none" marker-end="url(#a-tea)"/>
  <text x="200" y="344" fill="#16a085" font-size="8.5">.specimen</text>

  <!-- BioSampleAnalysisRequest.specimen → BioSample (short horizontal in gap) -->
  <line x1="410" y1="315" x2="396" y2="315" stroke="#16a085" stroke-width="1.3" marker-end="url(#a-tea)"/>

  <!-- ClinicalEventFlagObs.focus → ClinicalEvent (short horizontal in gap) -->
  <line x1="716" y1="312" x2="702" y2="312" stroke="#555" stroke-width="1.3" stroke-dasharray="4 2" marker-end="url(#a-drk)"/>

  <!-- ClinicalEventProcedure.reasonRef → ClinicalEvent
       Route BELOW Tier 4 to avoid passing through ClinicalEventFlagObs box -->
  <polyline points="944,334 944,348 643,348 643,334"
            stroke="#555" stroke-width="1.2" stroke-dasharray="4 2" fill="none" marker-end="url(#a-drk)"/>
  <text x="800" y="344" fill="#555" font-size="8.5">.reasonRef</text>

  <!-- ═══════════════════════════════════════════════
       TIER 5 — MEDICATIONS  (y = 368, red)
       ═══════════════════════════════════════════════ -->

  <!-- PreMedication -->
  <rect x="10"  y="368" width="120" height="38" rx="5" fill="#c0392b"/>
  <text x="70"  y="384" fill="white" font-weight="600" text-anchor="middle">PreMedication</text>
  <text x="70"  y="398" fill="#ffd0cc" font-size="9"   text-anchor="middle">MedicationStatement</text>

  <!-- PreMedicationChild -->
  <rect x="144" y="368" width="120" height="38" rx="5" fill="#c0392b"/>
  <text x="204" y="384" fill="white" font-weight="600" text-anchor="middle">PreMedChild</text>
  <text x="204" y="398" fill="#ffd0cc" font-size="9"   text-anchor="middle">MedicationStatement</text>

  <!-- ConcomitantMedication -->
  <rect x="278" y="368" width="136" height="38" rx="5" fill="#c0392b"/>
  <text x="346" y="384" fill="white" font-weight="600" text-anchor="middle">ConcomitantMed</text>
  <text x="346" y="398" fill="#ffd0cc" font-size="9"   text-anchor="middle">MedicationStatement</text>

  <!-- ImmPat -->
  <rect x="428" y="368" width="100" height="38" rx="5" fill="#c0392b"/>
  <text x="478" y="384" fill="white" font-weight="600" text-anchor="middle">ImmPat</text>
  <text x="478" y="398" fill="#ffd0cc" font-size="9"   text-anchor="middle">MedicationStatement</text>

  <!-- Immunosuppressant -->
  <rect x="544" y="368" width="148" height="38" rx="5" fill="#c0392b" opacity="0.75"/>
  <text x="618" y="384" fill="white" font-weight="600" text-anchor="middle">Immunosuppressant</text>
  <text x="618" y="398" fill="#ffd0cc" font-size="9"   text-anchor="middle">Medication</text>

  <!-- PreMedicationChild.partOf → PreMedication (short horizontal in row) -->
  <line x1="144" y1="383" x2="130" y2="383" stroke="#555" stroke-width="1.3" stroke-dasharray="2 2" marker-end="url(#a-drk)"/>

  <!-- ImmPat.medication → Immunosuppressant (short horizontal in row) -->
  <line x1="528" y1="387" x2="544" y2="387" stroke="#c0392b" stroke-width="1.3" marker-end="url(#a-red)"/>

  <!-- ImmPatPKObs.partOf → ImmPat
       Route: right side of canvas (x=1050) to avoid ClinEventProcedure, down to row gap, then left to ImmPat top -->
  <polyline points="975,274 1050,274 1050,357 478,357 478,368"
            stroke="#555" stroke-width="1.2" stroke-dasharray="2 2" fill="none" marker-end="url(#a-drk)"/>
  <text x="780" y="353" fill="#555" font-size="8.5">.partOf</text>

</svg>
